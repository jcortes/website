name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR runs are cancelled. Runs on main are never cancelled once
# started; a run still waiting is replaced by a newer one (GitHub keeps one
# pending run per group), which then applies and deploys the newer main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build, E2E, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Every built page; fails below 95 on performance and reports
      # accessibility, best practices and SEO (see lighthouserc.json).
      - name: Lighthouse CI
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 7

      - name: Build with E2E fixture content (into dist-e2e/)
        run: pnpm build
        env:
          CONTENT_FIXTURES: "true"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (against the production build, incl. privacy guard)
        run: pnpm test:e2e
        env:
          # Client names the built site must never contain. A repository
          # secret, so the names stay out of this public repo; the guard fails
          # in CI when it's missing.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # OpenTofu (infra/): checks and plans on every PR, applies on main. Its
  # outputs (public values) feed the build in the deploy job. Needs the
  # production environment's secrets, which PRs from forks don't get.
  infra:
    name: OpenTofu fmt, validate, plan / apply
    needs: verify
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Applies run one at a time and aren't cancelled once started (see the
    # workflow's concurrency). Plans are read-only (-lock=false), so they
    # only wait for their own PR's earlier run.
    concurrency:
      group: opentofu-${{ github.event_name == 'push' && 'apply' || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # State backend: the R2 bucket, through its S3-compatible API (ADR 0002).
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_contact_to_email: ${{ secrets.CONTACT_TO_EMAIL }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
    outputs:
      project_name: ${{ steps.outputs.outputs.project_name }}
      site_url: ${{ steps.outputs.outputs.site_url }}
      turnstile_site_key: ${{ steps.outputs.outputs.turnstile_site_key }}
      web_analytics_token: ${{ steps.outputs.outputs.web_analytics_token }}
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: tofu fmt -check
        run: tofu fmt -check -recursive -diff

      - name: tofu init
        run: tofu init

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        if: ${{ github.event_name == 'pull_request' }}
        id: plan
        run: |
          set +e
          tofu plan -no-color -lock=false -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          # 0: no changes, 2: changes; anything else is an error.
          [[ $code == 0 || $code == 2 ]] || exit "$code"
          echo "changes=$([[ $code == 2 ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Post the plan to the PR
        if: ${{ github.event_name == 'pull_request' && always() && steps.plan.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- tofu-plan -->"
            echo "### OpenTofu plan: ${{ steps.plan.outcome == 'success' && (steps.plan.outputs.changes == 'yes' && 'changes' || 'no changes') || 'failed' }}"
            echo
            echo "<details><summary>tofu plan for ${{ github.event.pull_request.head.sha }}</summary>"
            echo
            echo '```'
            # Comments are capped at 65,536 characters.
            head -c 60000 plan.txt 2>/dev/null || echo "(no plan output)"
            echo '```'
            echo "</details>"
          } > plan.md
          ../.github/scripts/upsert-pr-comment.sh "<!-- tofu-plan -->" plan.md

      - name: tofu apply
        if: ${{ github.event_name == 'push' }}
        run: tofu apply -auto-approve

      # Empty until the first apply has created the infrastructure; the
      # deploy job is skipped until then.
      - name: Read outputs
        id: outputs
        run: |
          tofu output -json > outputs.json
          for name in project_name site_url turnstile_site_key web_analytics_token; do
            echo "$name=$(jq -r --arg n "$name" '.[$n].value // empty' outputs.json)" >> "$GITHUB_OUTPUT"
          done

  # Builds the site with the infrastructure's public values and deploys it to
  # Cloudflare Pages: a preview per PR branch, production from main.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: [verify, infra]
    if: ${{ needs.infra.outputs.project_name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ needs.infra.outputs.site_url }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ needs.infra.outputs.turnstile_site_key }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ needs.infra.outputs.web_analytics_token }}

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # main is the production branch; any other branch is a preview.
          command: >-
            pages deploy dist
            --project-name=${{ needs.infra.outputs.project_name }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Post the preview URL to the PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- pages-preview -->"
            echo "### Preview deploy"
            echo
            echo "${{ steps.deploy.outputs.deployment-url }} (${{ github.event.pull_request.head.sha }})"
          } > preview.md
          .github/scripts/upsert-pr-comment.sh "<!-- pages-preview -->" preview.md

      - name: Production URL
        if: ${{ github.event_name == 'push' }}
        run: echo "Deployed ${{ steps.deploy.outputs.deployment-url }} (production ${{ needs.infra.outputs.site_url }})" >> "$GITHUB_STEP_SUMMARY"
