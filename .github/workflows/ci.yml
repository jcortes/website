name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build with E2E fixture content (into dist-e2e/)
        run: pnpm build
        env:
          CONTENT_FIXTURES: "true"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (against the production build, incl. privacy guard)
        run: pnpm test:e2e
        env:
          # Client names the built site must never contain. A repository
          # secret, so the names stay out of this public repo; the guard fails
          # in CI when it's missing.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
