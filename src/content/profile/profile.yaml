name: Jorge Cortes
headline:
  es: Ingeniero de Software y DevOps
  en: Software & DevOps Engineer
location:
  es: Bogotá, Colombia · Trabajo remoto
  en: Bogotá, Colombia · Working remotely
positioning:
  es: >-
    Ingeniero de sistemas con 15+ años de experiencia en desarrollo backend, nube (AWS) y CI/CD. Ayudo a empresas a
    automatizar sus entregas, llevar su infraestructura a código y construir backends y APIs confiables.
  en: >-
    Systems engineer with 15+ years of experience in backend development, cloud (AWS) and CI/CD. I help companies
    automate their delivery, move their infrastructure to code and build reliable backends and APIs.
summary:
  - es: >-
      A lo largo de mi carrera he trabajado con clientes internacionales y he contribuido a productos de los que
      dependen usuarios reales: plataformas de integraciones, sistemas de inventario, plataformas de
      farmacovigilancia y aplicaciones para el sector financiero.
    en: >-
      Throughout my career I've worked with international clients and contributed to products that real users rely
      on: integration platforms, inventory systems, pharmacovigilance platforms and applications for the financial
      sector.
  - es: >-
      Creo que el buen software empieza con una comunicación clara y expectativas honestas: cuando trabajas conmigo,
      siempre sabes en qué punto están las cosas. El buen software no se construye solo; se construye en equipo, y
      para todos.
    en: >-
      I believe great software starts with clear communication and honest expectations: when you work with me, you
      always know where things stand. Great software isn't built alone; it's built together, for everyone.

