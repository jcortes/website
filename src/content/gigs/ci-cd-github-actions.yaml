faq:
  - question:
      es: ¿Necesito tener el código en GitHub?
      en: Does my code need to be on GitHub?
    answer:
      es: Sí, el pipeline vive en GitHub Actions. Si tu código está en otra plataforma, podemos incluir la migración en la propuesta.
      en: Yes, the pipeline runs on GitHub Actions. If your code lives elsewhere, the migration can be part of the proposal.
  - question:
      es: ¿Funciona con mi stack?
      en: Will it work with my stack?
    answer:
      es: GitHub Actions soporta la mayoría de lenguajes y plataformas (Node.js, Python, Docker y más). Lo confirmamos en el diagnóstico inicial.
      en: GitHub Actions supports most languages and platforms (Node.js, Python, Docker and more). We confirm it during the initial diagnosis.
  - question:
      es: ¿Quién paga los minutos de GitHub Actions?
      en: Who pays for the GitHub Actions minutes?
    answer:
      es: Los workflows se ejecutan en tu cuenta. Los diseño con caché y condiciones para evitar ejecuciones innecesarias.
      en: The workflows run on your account. I design them with caching and conditions to avoid unnecessary runs.
  - question:
      es: ¿Qué pasa si necesito ajustes después de la entrega?
      en: What if I need changes after delivery?
    answer:
      es: Cada paquete incluye rondas de revisión. Para soporte continuo podemos acordar un plan aparte.
      en: Every package includes revision rounds. For ongoing support we can agree on a separate plan.
