order: 1
title:
  es: "Despliega con confianza: pipeline de CI/CD con GitHub Actions"
  en: "Ship with confidence: a CI/CD pipeline with GitHub Actions"
summary:
  es: Cada cambio se prueba, se construye y se despliega de forma automática, sin pasos manuales ni sorpresas en producción.
  en: Every change is tested, built and deployed automatically, with no manual steps and no surprises in production.
description:
  es: >-
    Si hoy desplegar depende de una persona, de una lista de pasos o de cruzar los dedos, cada release es un riesgo.
    Diseño e implemento un pipeline en GitHub Actions que ejecuta lint, pruebas y build en cada pull request,
    publica entornos de vista previa y despliega a producción de forma repetible, con los secretos fuera del repositorio.
  en: >-
    If deploying today depends on one person, a checklist or crossed fingers, every release is a risk.
    I design and build a GitHub Actions pipeline that runs linting, tests and the build on every pull request,
    publishes preview environments and deploys to production repeatably, with secrets kept out of the repository.
category:
  es: DevOps · CI/CD
  en: DevOps · CI/CD
tags:
  - { es: GitHub Actions, en: GitHub Actions }
  - { es: Integración continua, en: Continuous integration }
  - { es: Despliegue continuo, en: Continuous deployment }
  - { es: Pruebas automatizadas, en: Automated testing }
gallery:
  - image: ../../assets/gigs/ci-cd-github-actions/gallery/0/image.svg
    alt:
      es: "Diagrama del pipeline: cada pull request pasa por lint, pruebas y build y genera una vista previa; al fusionar a main se repiten los checks, se aprueba y se despliega a producción."
      en: "Pipeline diagram: every pull request goes through linting, tests and build and gets a preview; merging to main repeats the checks, requires approval and deploys to production."
