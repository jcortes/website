order: 2
title:
  es: "Infraestructura reproducible en AWS: infraestructura como código con Terraform/OpenTofu"
  en: "Reproducible AWS infrastructure: infrastructure as code with Terraform/OpenTofu"
summary:
  es: Tu infraestructura en código versionado, revisable y fácil de recrear, en lugar de configuraciones hechas a mano en la consola.
  en: Your infrastructure as versioned code that is reviewable and easy to recreate, instead of settings clicked together in the console.
description:
  es: >-
    Cuando la infraestructura se crea a mano, nadie sabe con certeza qué hay desplegado, cada entorno es un poco distinto
    y recuperarse de un error es lento. Defino tu infraestructura de AWS como código con Terraform u OpenTofu:
    cada cambio pasa por un plan revisado antes de aplicarse, los entornos son consistentes y todo queda documentado en el repositorio.
  en: >-
    When infrastructure is built by hand, nobody knows for sure what is deployed, every environment is slightly different
    and recovering from a mistake is slow. I define your AWS infrastructure as code with Terraform or OpenTofu:
    every change goes through a reviewed plan before it is applied, environments stay consistent and everything is documented in the repository.
category:
  es: Nube · AWS
  en: Cloud · AWS
tags:
  - { es: AWS, en: AWS }
  - { es: Terraform, en: Terraform }
  - { es: OpenTofu, en: OpenTofu }
  - { es: Infraestructura como código, en: Infrastructure as code }
gallery:
