faq:
  - question:
      es: ¿Terraform u OpenTofu?
      en: Terraform or OpenTofu?
    answer:
      es: Son compatibles en la mayoría de casos; OpenTofu es la alternativa de código abierto. Te recomiendo uno según tu contexto y licencias.
      en: They are compatible in most cases; OpenTofu is the open-source alternative. I recommend one based on your context and licensing.
  - question:
      es: ¿Puedes trabajar con infraestructura que ya existe?
      en: Can you work with infrastructure that already exists?
    answer:
      es: Sí. Los recursos existentes se importan al código sin recrearlos.
      en: Yes. Existing resources are imported into code without recreating them.
  - question:
      es: ¿Se verán afectados mis servicios en producción?
      en: Will my production services be affected?
    answer:
      es: Cada cambio se revisa con un plan antes de aplicarse, y los cambios con riesgo se acuerdan contigo y se programan.
      en: Every change is reviewed as a plan before it is applied, and risky changes are agreed with you and scheduled.
  - question:
      es: ¿Quién paga los costos de AWS?
      en: Who pays the AWS costs?
    answer:
      es: La infraestructura vive en tu cuenta de AWS. Te aviso de las decisiones que afectan el costo antes de tomarlas.
      en: The infrastructure lives in your AWS account. I flag decisions that affect cost before making them.
