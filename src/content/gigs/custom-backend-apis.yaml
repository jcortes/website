          en: Event-driven architecture with queues,
        }
      - { es: "Logs, métricas y alertas", en: "Logs, metrics and alerts" }
      - { es: Pipeline de CI/CD, en: CI/CD pipeline }
      - {
          es: Sesión de traspaso con tu equipo,
          en: A handover session with your team,
        }
    deliveryDays: 30
    revisions: 3
faq:
  - question:
      es: ¿Con qué tecnologías trabajas?
      en: Which technologies do you work with?
    answer:
      es: Node.js y TypeScript con NestJS o Express, GraphQL, PostgreSQL, MongoDB y DynamoDB, y AWS (Lambda, API Gateway, contenedores).
      en: Node.js and TypeScript with NestJS or Express, GraphQL, PostgreSQL, MongoDB and DynamoDB, and AWS (Lambda, API Gateway, containers).
  - question:
      es: ¿Puedes trabajar sobre código que ya existe?
      en: Can you work on an existing codebase?
    answer:
      es: Sí. Empiezo por entender el código y sus pruebas, y propongo los cambios dentro de la arquitectura que ya tienes.
      en: Yes. I start by understanding the code and its tests, and propose changes within the architecture you already have.
  - question:
      es: ¿De quién es el código?
      en: Who owns the code?
    answer:
      es: El código es tuyo y vive en tu repositorio desde el primer día.
      en: The code is yours and lives in your repository from day one.
  - question:
      es: ¿Incluye pruebas?
      en: Are tests included?
    answer:
      es: Sí. Todos los paquetes incluyen pruebas automatizadas para el comportamiento entregado.
      en: Yes. Every package includes automated tests for the delivered behavior.
requirements:
  - {
      es: Una descripción del problema y de quién va a usar el sistema,
      en: A description of the problem and who will use the system,
    }
  - {
      es: Documentación y credenciales de prueba de los sistemas a integrar,
      en: Documentation and test credentials for the systems to integrate,
    }
  - {
      es: "Acceso al repositorio y a la cuenta de nube, o la decisión de crearlos",
      en: "Access to the repository and cloud account, or the decision to create them",
    }
  - {
      es: Una persona que pueda tomar decisiones de producto,
      en: Someone who can make product decisions,
    }
