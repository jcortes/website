order: 3
title:
  es: "Software a medida: backend, APIs e integraciones que conectan tu negocio"
  en: "Custom software: backends, APIs and integrations that connect your business"
summary:
  es: Backends y APIs con Node.js, NestJS y GraphQL, e integraciones con otros sistemas, sobre AWS serverless o contenedores.
  en: Backends and APIs with Node.js, NestJS and GraphQL, plus integrations with other systems, on AWS serverless or containers.
description:
  es: >-
    Necesitas que tus sistemas hablen entre sí, exponer tus datos a una app o construir el backend de un producto nuevo.
    Desarrollo APIs REST y GraphQL con Node.js, TypeScript y NestJS, integro servicios de terceros mediante APIs y webhooks,
    y lo despliego en AWS con Lambda o contenedores, con pruebas automatizadas y documentación desde el primer día.
  en: >-
    You need your systems to talk to each other, to expose your data to an app, or to build the backend of a new product.
    I build REST and GraphQL APIs with Node.js, TypeScript and NestJS, integrate third-party services through APIs and webhooks,
    and deploy them on AWS with Lambda or containers, with automated tests and documentation from day one.
category:
  es: Desarrollo backend
  en: Backend development
tags:
  - { es: Node.js, en: Node.js }
  - { es: NestJS, en: NestJS }
  - { es: GraphQL, en: GraphQL }
  - { es: AWS serverless, en: AWS serverless }
  - { es: Integraciones, en: Integrations }
gallery:
  - image: ../../assets/gigs/backend-apis.svg
    alt:
      es: "Diagrama de backend: los clientes web y móviles llaman a una API REST o GraphQL, que se apoya en servicios NestJS y funciones AWS Lambda conectadas a bases de datos, APIs de terceros y colas."
      en: "Backend diagram: web and mobile clients call a REST or GraphQL API, backed by NestJS services and AWS Lambda functions connected to databases, third-party APIs and queues."
packages:
  basic:
    name: { es: Básico, en: Basic }
    scope:
      es: Una integración o un endpoint puntual, por ejemplo conectar dos sistemas mediante una API o un webhook.
      en: A single integration or endpoint, for example connecting two systems through an API or a webhook.
    deliverables:
      - {
          es: Integración o endpoint en Node.js y TypeScript,
          en: Integration or endpoint in Node.js and TypeScript,
        }
      - {
          es: Validación de entradas y manejo de errores,
          en: Input validation and error handling,
        }
      - { es: Pruebas automatizadas, en: Automated tests }
      - { es: Documentación de uso, en: Usage documentation }
    deliveryDays: 5
    revisions: 1
  standard:
    name: { es: Estándar, en: Standard }
    scope:
      es: Una API REST o GraphQL completa con NestJS, desplegada en AWS.
      en: A complete REST or GraphQL API with NestJS, deployed on AWS.
    deliverables:
      - { es: Todo lo del paquete Básico, en: Everything in Basic }
      - { es: Modelo de datos y base de datos, en: Data model and database }
      - {
          es: Autenticación y autorización,
          en: Authentication and authorization,
        }
      - { es: Documentación de la API, en: API documentation }
      - {
          es: Despliegue en AWS (Lambda o contenedores),
          en: Deployment on AWS (Lambda or containers),
        }
    deliveryDays: 15
    revisions: 2
  premium:
    name: { es: Premium, en: Premium }
    scope:
      es: El backend de un producto, con varios servicios, eventos y colas, y todo lo necesario para operarlo.
